[project]
name = "deepseek-document-translator"
version = "0.1.0"
description = "Telegram document translation service powered by DeepSeek API."
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.6",
    "fastapi>=0.111",
    "httpx>=0.28",
    "cryptography>=42",
    "psutil>=5.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "rq>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
