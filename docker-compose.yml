x-default-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "5"

x-default-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 20s

services:
  api:
    build: .
    command: uvicorn translator_service.api:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "127.0.0.1:62062:8000"
    volumes:
      - ./var:/app/var
      - ./var:/data
    depends_on:
      - postgres
      - redis
      - clamd
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test:
        - CMD
        - python
        - -c
        - "import http.client; c=http.client.HTTPConnection('127.0.0.1', 8000, timeout=5); c.request('GET', '/health'); raise SystemExit(0 if c.getresponse().status == 200 else 1)"

  bot:
    build: .
    command: python -m translator_service.bot
    env_file: .env
    environment:
      BOT_DEFER_PERSISTENT_JOBS_TO_WORKER: "true"
    volumes:
      - ./var:/app/var
      - ./var:/data
    depends_on:
      - postgres
      - redis
      - clamd
    restart: unless-stopped
    logging: *default-logging

  worker:
    build: .
    command: python -m translator_service.worker
    env_file: .env
    volumes:
      - ./var:/app/var
      - ./var:/data
    depends_on:
      - postgres
      - redis
      - clamd
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-translator}
      POSTGRES_USER: ${POSTGRES_USER:-translator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-translator}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test:
        - CMD-SHELL
        - "pg_isready -U \"$${POSTGRES_USER:-translator}\" -d \"$${POSTGRES_DB:-translator}\""

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      test:
        - CMD
        - redis-cli
        - ping

  clamd:
    image: ${CLAMD_IMAGE:-clamav/clamav:1.4}
    platform: ${CLAMD_PLATFORM:-linux/amd64}
    expose:
      - "3310"
    environment:
      CLAMAV_NO_CLAMD: "false"
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMD_STARTUP_TIMEOUT: "${CLAMD_STARTUP_TIMEOUT:-1800}"
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${CLAMD_MEM_LIMIT:-1g}
    cpus: "${CLAMD_CPUS:-1.0}"
    pids_limit: 256
    healthcheck:
      <<: *default-healthcheck
      start_period: 5m
      test:
        - CMD
        - clamdscan
        - --ping=1

volumes:
  postgres-data:
  clamav-db:
