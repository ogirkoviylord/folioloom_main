name: Agent-ready task
description: Define one focused task with clear scope, acceptance criteria, verification, risks, and approval gates.
title: "[Task] "
labels:
  - agent-ready
  - needs-review
body:
  - type: markdown
    attributes:
      value: |
        Use this only when the task is ready for an agent to implement or update. One issue should normally produce one focused PR.

        Do not include high-risk work unless the required human approval is explicit in the issue. Use `TBD` for human decisions and `Unknown` when repository evidence is missing.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The single outcome this task must achieve.
    validations:
      required: true
  - type: dropdown
    id: task_type
    attributes:
      label: Task classification
      description: Match AGENTS.md task intake terms.
      options:
        - safe-small-task
        - bugfix
        - feature
        - docs-only
        - spike / discovery
        - risky task
        - release-related task
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and evidence
      description: Link relevant docs, code, previous issues, PRs, or observed behavior. Separate confirmed facts from assumptions.
      placeholder: "- Confirmed: ...\n- Assumption: ...\n- Unknown: ..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files, modules, behavior, or docs the agent may change.
      placeholder: "- In scope: ..."
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Files, modules, behaviors, or decisions the agent must not change.
      placeholder: "- Out of scope: secrets, deployment, payments, auth, legal/privacy, user-data, migrations unless explicitly approved."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Concrete checklist for completion.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: List focused tests/checks from docs/QUALITY_GATES.md or explain why none apply.
      placeholder: "- [ ] Command: `...`\n- [ ] Manual/review check: ..."
    validations:
      required: true
  - type: textarea
    id: docs_impact
    attributes:
      label: Docs impact
      description: State whether docs should change. If not, explain why.
      placeholder: "Docs impact: TBD / none expected / update required in ..."
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Include regression, data, safety, privacy, payment, auth, deployment, release, and AI-workflow risks.
      placeholder: "- Risk: ...\n- Mitigation: ..."
    validations:
      required: true
  - type: checkboxes
    id: approval_gates
    attributes:
      label: Human approval gates
      description: Check all areas touched. If any high-risk item is checked, the issue must include explicit owner approval before implementation.
      options:
        - label: Secrets, real `.env*`, keys, tokens, passwords, or secret storage.
        - label: Deployment, Docker, server scripts, production operations, bind addresses, or public admin exposure.
        - label: Payments, pricing, billing, refunds, paid jobs, payment UI, or provider/payment policy.
        - label: Auth, security, RBAC, sessions, admin access, telemetry, or redaction boundaries.
        - label: Legal/privacy/AUP/refund/support text or user-data handling.
        - label: Database schema/state, migrations, scheduler/job/work-unit state, retention, TTL, backups, restore, runtime `var/`, or destructive operations.
        - label: New production dependencies.
        - label: Product scope beyond Telegram-first closed beta, TXT/DOCX/EPUB, or the approved MVP.
        - label: No high-risk approval gate identified from current evidence.
  - type: textarea
    id: human_approval
    attributes:
      label: Human approval evidence
      description: Required for high-risk work. Use `TBD` if approval is still needed.
      placeholder: "TBD"
    validations:
      required: true
  - type: textarea
    id: recommended_labels
    attributes:
      label: Recommended labels
      description: Add only existing labels such as `safe-small-task`, `feature`, `spike`, `docs`, `needs-tests`, `needs-docs`, `needs-architect`, `needs-human-approval`, `risky-change`, `release-blocker`, or `blocked`.
      placeholder: "- agent-ready\n- safe-small-task\n- needs-tests\n- needs-review"
    validations:
      required: true
