name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: python -m pip install -e .

      - name: Compile source
        run: PYTHONPATH=src python -m compileall src

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests
